name: CI & Build Multiplataforma

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: zorya-linux-amd64
            target_binary: target/release/zorya
            output_name: zorya
          - os: windows-latest
            artifact_name: zorya-windows-amd64
            target_binary: target/release/zorya.exe
            output_name: zorya.exe

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Dependências de Compilação C/C++ (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make pkg-config

      - name: Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Compilação Rust
        uses: Swatinem/rust-cache@v2

      - name: Verificação de Código (Cargo Check)
        run: cargo check --verbose

      - name: Compilação de Produção (Cargo Build Release)
        run: cargo build --release --verbose

      - name: Renomear Binário para Publicação
        shell: bash
        run: |
          cp ${{ matrix.target_binary }} ${{ matrix.output_name }}

      - name: Upload de Artefato de Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_name }}

  release:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar Todos os Artefatos
        uses: actions/download-artifact@v4

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zorya-windows-amd64/zorya.exe
            zorya-linux-amd64/zorya
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
