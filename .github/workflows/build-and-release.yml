name: Build and Release (Cloud CI/CD)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: zorya.exe
            archive: zorya-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: zorya
            archive: zorya-linux-x86_64.tar.gz

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Dependências de Sistema (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential clang cmake

      - name: Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de Compilação Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar Binário Otimizado (Release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empacotar Artefatos (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/zorya.exe"
          if (-not (Test-Path $bin)) { $bin = "target/release/zorya.exe" }
          mkdir dist -ErrorAction SilentlyContinue
          Copy-Item $bin dist\zorya.exe
          if (Test-Path README.md) { Copy-Item README.md dist\ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist\ }
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.archive }} -Force

      - name: Empacotar Artefatos (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/release/zorya"
          if [ ! -f "$BIN" ]; then BIN="target/release/zorya"; fi
          mkdir -p dist
          cp "$BIN" dist/zorya
          if [ -f README.md ]; then cp README.md dist/; fi
          if [ -f LICENSE ]; then cp LICENSE dist/; fi
          tar -czvf ${{ matrix.archive }} -C dist .

      - name: Publicar Artefato do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Publicar GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Baixar Todos os Artefatos
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Gerar Checksums SHA256
        run: |
          cd release-artifacts
          sha256sum zorya-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
