# Mriya Ecosystem — Nginx Security & Anti-Scanner Hardening / Bloco de Segurança e Anti-Scanner do Nginx
# Copy to /etc/nginx/conf.d/security.conf (http context) and include /etc/nginx/snippets/mriya-security-locations.conf inside server {} blocks / Copie para /etc/nginx/conf.d/security.conf

# Rate limit of 10 req/min per IP for routes returning 404 / Limite de 10 req/min por IP para rotas que retornam 404
limit_req_zone $binary_remote_addr zone=mriya_404_limit:10m rate=10r/m;

# Server block rules to include inside `server { ... }` / Regras de bloqueio para incluir dentro do bloco `server { ... }`:
# -------------------------------------------------------------------------
# Block and drop connection (HTTP 444) for sensitive files and scanner paths / Bloqueia e encerra conexão (444) para arquivos sensíveis e rotas de scanners
location ~* \.(yaml|yml|env|git)$ {
    return 444;
}

location ~* ^/(secret\.yaml|serverless\.yml|\.env|docker-compose\.yml|wlwmanifest\.xml|wp-login\.php)$ {
    return 444;
}

location ~* /(actuator|wp-admin|wp-login|wlwmanifest|\.git) {
    return 444;
}

# Rate limit 404 responses to 10 requests/minute per IP / Aplica rate limit de 10 req/min por IP em qualquer rota 404
error_page 404 = @mriya_rate_limited_404;
location @mriya_rate_limited_404 {
    limit_req zone=mriya_404_limit burst=5 nodelay;
    limit_req_status 429;
    default_type application/json;
    return 404 '{"error":"Not Found","status":404}';
}
