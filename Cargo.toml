[package]
name = "zorya"
version = "3.0.0"
edition = "2021"
authors = ["Pedro Luís Tenório <pedro@espectroipe.com.br>"]
description = "Sovereign Rust AI & Multimedia Coprocessor Daemon (Axum + boringtun + Headscale + ArtCraft + MCP SSE)"
license = "MIT OR Apache-2.0"

[features]
default = ["systray"]
artcraft-linked = []
systray = ["dep:tray-icon"]
cuda = []
vulkan = []
opencl = []
cpu-only = []
llama-native = []

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
bytes = "1.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.22"
boringtun = "0.6"
x25519-dalek = { version = "=2.0.0-rc.3", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sysinfo = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1.0"
thiserror = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.17", optional = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
