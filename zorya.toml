[server]
host = "0.0.0.0"
port = 8085
enable_mcp_sse = true
mcp_sse_path = "/mcp/sse"
log_level = "info"

[network]
node_name = "Usina-Zorya-Nitro"
allowed_ip = "0.0.0.0/0"
listen_port = 8085
prefer_tailscale = true
tailscale_peer_hostname = "100.106.120.35"
fallback_ip = "0.0.0.0"
fallback_vps_ip = "143.95.223.218"
fallback_nitro_ip = "100.106.120.35"
reconnect_interval_secs = 30

[models]
models_dir = "models"
nitro_default = "qwen2.5-7b-instruct-q4_k_m.gguf"
vps_default = "qwen2.5-3b-instruct-q4_k_m.gguf"
fast_model = "qwen2.5-3b-instruct-q4_k_m.gguf"
deep_model = "qwen2.5-7b-instruct-q4_k_m.gguf"
gpu_layers = 33
context_size = 8192
max_tokens = 4096
ttl_seconds = 3600

[inference]
ollama_url = "http://127.0.0.1:11434"
default_model = "qwen2.5-7b-instruct-q4_k_m.gguf"
dedicated_vram_mb = 4096
gpu_device_index = 0

[credentials]
groq_keys = []
gemini_keys = []
openai_keys = []
vps_credentials_path = "/var/www/mcp-server/credentials/credentials.json"
validation_cache_ttl_hours = 24
groq_primary_model = "openai/gpt-oss-120b"
groq_fast_model = "openai/gpt-oss-20b"
groq_multilingual_model = "qwen/qwen3.8-27b"
groq_whisper_model = "whisper-large-v3"
gemini_model = "gemini-2.5-flash"

[craft]
enabled = ["lightcraft", "photocraft", "vectorcraft", "soundcraft", "pdfcraft"]
denoise_default_method = "bilateral"
audio_target_lufs = -14.0
audio_max_true_peak_db = -1.0
default_icc_profile = "sRGB"

[cluster]
node_role = "nitro_primary"
peer_endpoint = "https://svitlo.espectroipe.com.br"
health_check_interval_secs = 30
auto_failover = true
shared_secret = "zorya-cluster-2026-sovereign"
