# ============================================================
# ZORYA v3.0 — Sovereign Native AI & Creative Engine Config
# Rust Single-Binary Edition (Zero Python / Zero Ollama)
# ============================================================

[server]
host = "0.0.0.0"
port = 8085
workers = 4
enable_cors = true
request_timeout_secs = 120

[network]
node_name = "Usina-Zorya-Nitro"
allowed_ip = "0.0.0.0/0"
listen_port = 8085
prefer_tailscale = true
tailscale_peer_hostname = "100.106.120.35"
lan_broadcast_port = 8086
fallback_nitro_ip = "100.106.120.35"

[models]
directory = "models"
fast_model = "Qwen3.5-4B-Instruct-Q4_K_M.gguf"
deep_model = "Qwen3.5-9B-Instruct-Q4_K_M.gguf"
vision_model = "Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"
ttl_seconds = 300
context_size = 8192
gpu_layers = 35
max_tokens = 2048

[craft]
enabled = ["lightcraft", "photocraft", "vectorcraft", "soundcraft", "pdfcraft"]

[artcraft]
default_lut_intensity = 0.85
upscale_tile_size = 512
audio_target_lufs = -14.0
svg_canvas_width = 1200
svg_canvas_height = 675

[ai_keys]
gemini_api_key = ""
groq_api_key = ""
anthropic_api_key = ""
openai_api_key = ""
groq_primary_model = "openai/gpt-oss-120b"
groq_fast_model = "openai/gpt-oss-20b"
groq_multilingual_model = "qwen/qwen3.8-27b"
gemini_model = "gemini-2.5-flash"

[cluster]
enable_compute_sharing = true
coordinator_url = "https://api.espectroipe.com.br/api/v1/zorya/register"
heartbeat_interval_secs = 60
max_concurrent_jobs = 2

[paths]
ffmpeg_bin = "ffmpeg"
temp_dir = "cache/tmp"

[security]
api_secret = "zorya-local-mesh-token-2026"
