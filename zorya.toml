# PT: Arquivo Mestre de Configuração do Zorya v3.0 (Nitro 5 & VPS Espectro Ipê)
# EN: Master Configuration File for Zorya v3.0 (Nitro 5 & VPS Espectro Ipe)

[server]
host = "0.0.0.0"
port = 8085
enable_mcp_sse = true
mcp_sse_path = "/mcp/sse"
log_level = "info"

[hardware]
# "auto", "nitro_cuda", "vps_cpu", "vulkan", "opencl"
profile = "auto"
dedicated_vram_mb = 4096
reserve_display_on_igpu = true
cpu_threads_override = 0

[models]
models_dir = "/opt/zorya/models"
nitro_default = "qwen2.5-7b-instruct-q4_k_m.gguf"
vps_default = "qwen2.5-3b-instruct-q4_k_m.gguf"
nitro_ctx_size = 8192
vps_ctx_size = 2048
batch_size = 512

[network]
node_name = "Usina-Zorya-Nitro"
allowed_ip = "0.0.0.0/0"
listen_port = 8085
tailscale_peer_hostname = "100.106.120.35"
# Zero dependência obrigatória de Tailscale: usa localapi se ativo, senão usa IP direto
prefer_tailscale = true
tailscale_local_api = "http://127.0.0.1:41112/localapi/v0/status"
fallback_vps_ip = "72.60.144.210"
fallback_nitro_ip = "100.106.120.35"
reconnect_interval_secs = 30

[cluster]
node_role = "nitro" # "nitro" ou "vps"
peer_endpoint = "http://72.60.144.210:8085"
health_check_interval_secs = 30
offload_light_tasks_to_vps = true

[keys]
vps_credentials_path = "/var/www/mcp-server/credentials/credentials.json"
validation_cache_ttl_hours = 24
groq_primary_model = "openai/gpt-oss-120b"
groq_fast_model = "qwen2.5:7b"
groq_multilingual_model = "qwen/qwen3.8-27b"
groq_whisper_model = "whisper-large-v3"

[craft]
enabled = ["lightcraft", "photocraft", "vectorcraft", "soundcraft", "pdfcraft"]
denoise_default_method = "bilateral" # "bilateral", "wiener", "unsharp" - ZERO IA
audio_target_lufs = -14.0
audio_max_true_peak_db = -1.0
default_icc_profile = "sRGB"

[youtube]
client_id = "SEU_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
client_secret = "SEU_GOOGLE_CLIENT_SECRET"
refresh_token = "SEU_REFRESH_TOKEN_OAUTH2"
default_privacy = "unlisted" # "public", "unlisted", "private"
default_category_id = "27"   # 27 = Education
channel_language = "pt-BR"
